[package]
name = "g04-tauri-spike"
version = "0.0.1"
description = "EXPLORATION / NOT CANONICAL ARCHITECTURE / NOT PRODUCTION COMMITMENT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
