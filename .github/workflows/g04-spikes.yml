name: G0.4 Disposable Technical Spikes

on:
  push:
    branches:
      - exploration/g04-spikes-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2-s3-domain-persistence:
    name: S2 SQLite + S3 Recurrence on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install timezone database
        run: python -m pip install --disable-pip-version-check tzdata
      - name: Run S2 SQLite durability backup migration spike
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exploration/g04-spikes/results | Out-Null
          python exploration/g04-spikes/s2_sqlite_spike.py | Tee-Object -FilePath exploration/g04-spikes/results/s2-result.json
      - name: Run S3 recurrence identity exception date-boundary spike
        shell: pwsh
        run: |
          python exploration/g04-spikes/s3_recurrence_spike.py | Tee-Object -FilePath exploration/g04-spikes/results/s3-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s2-s3-results
          path: exploration/g04-spikes/results/*

  s1-electron:
    name: S1 Electron packaged Windows lifecycle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: exploration/g04-spikes/s1-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: exploration/g04-spikes/s1-electron/package.json
      - name: Install Electron spike dependencies
        run: npm install --no-audit --no-fund
      - name: Package Electron Windows app
        run: npm run package:win
      - name: Run packaged Electron lifecycle probe
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'electron-spike.jsonl'
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:SPIKE_SELF_TEST = '1'
          $env:SPIKE_LOG = $log
          $exe = Resolve-Path '.\dist\win-unpacked\G04 Electron Spike.exe'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Write-Host "Electron packaged process exit code: $($p.ExitCode)"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Electron spike exited $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'selftest-pass' -Quiet)) { throw 'Electron lifecycle PASS marker missing' }
      - name: Record Electron packaged artifact
        shell: pwsh
        run: |
          Get-ChildItem .\dist -Recurse | Select-Object FullName,Length | Out-File electron-package-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s1-electron-results
          path: |
            exploration/g04-spikes/s1-electron/electron-spike.jsonl
            exploration/g04-spikes/s1-electron/electron-package-files.txt

  s1-tauri:
    name: S1 Tauri packaged Windows lifecycle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: exploration/g04-spikes/s1-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund
      - name: Generate disposable Windows icon
        run: node make-icon.js
      - name: Build Tauri release + NSIS package
        run: npm run build:win
      - name: Run Tauri release lifecycle probe
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'tauri-spike.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:SPIKE_SELF_TEST = '1'
          $env:SPIKE_LOG = $log
          $exe = Resolve-Path '.\src-tauri\target\release\g04-tauri-spike.exe'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Write-Host "Tauri release process exit code: $($p.ExitCode)"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Tauri spike exited $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'selftest-pass' -Quiet)) { throw 'Tauri lifecycle PASS marker missing' }
      - name: Verify NSIS package exists
        shell: pwsh
        run: |
          $bundle = Get-ChildItem '.\src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction Stop
          $bundle | Select-Object FullName,Length | Out-File tauri-package-files.txt
          Get-Content tauri-package-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s1-tauri-results
          path: |
            exploration/g04-spikes/s1-tauri/tauri-spike.log
            exploration/g04-spikes/s1-tauri/tauri-package-files.txt
