name: Workbench productization Windows
on:
  push:
    branches: [product/github-project-updates]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run package:win
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workbench-productization-windows-${{ github.sha }}
          path: |
            evidence/
            out/win-unpacked/
          retention-days: 14
