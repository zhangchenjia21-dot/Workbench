name: G0.4 Exploration Runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/g04-exploration-runner.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2-s3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exploration/g04-spikes-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check tzdata
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exploration/g04-spikes/results | Out-Null
          python exploration/g04-spikes/s2_sqlite_spike.py | Tee-Object -FilePath exploration/g04-spikes/results/s2-result.json
          python exploration/g04-spikes/s3_recurrence_spike.py | Tee-Object -FilePath exploration/g04-spikes/results/s3-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s2-s3-results
          path: exploration/g04-spikes/results/*

  s1-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exploration/g04-spikes-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        working-directory: exploration/g04-spikes/s1-electron
        run: |
          npm install --no-audit --no-fund
          npm run package:win
          $log = Join-Path $PWD 'electron-spike.jsonl'
          $env:SPIKE_SELF_TEST = '1'
          $env:SPIKE_LOG = $log
          $exe = Resolve-Path '.\dist\win-unpacked\G04 Electron Spike.exe'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Write-Host "Electron packaged process exit code: $($p.ExitCode)"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Electron spike exited $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'selftest-pass' -Quiet)) { throw 'Electron lifecycle PASS marker missing' }
          Get-ChildItem .\dist -Recurse | Select-Object FullName,Length | Out-File electron-package-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s1-electron-results
          path: |
            exploration/g04-spikes/s1-electron/electron-spike.jsonl
            exploration/g04-spikes/s1-electron/electron-package-files.txt

  s1-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exploration/g04-spikes-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        working-directory: exploration/g04-spikes/s1-tauri
        run: |
          npm install --no-audit --no-fund
          npm run build:win
          $log = Join-Path $PWD 'tauri-spike.log'
          $env:SPIKE_SELF_TEST = '1'
          $env:SPIKE_LOG = $log
          $exe = Resolve-Path '.\src-tauri\target\release\g04-tauri-spike.exe'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Write-Host "Tauri release process exit code: $($p.ExitCode)"
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Tauri spike exited $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'selftest-pass' -Quiet)) { throw 'Tauri lifecycle PASS marker missing' }
          Get-ChildItem '.\src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction Stop | Select-Object FullName,Length | Out-File tauri-package-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g04-s1-tauri-results
          path: |
            exploration/g04-spikes/s1-tauri/tauri-spike.log
            exploration/g04-spikes/s1-tauri/tauri-package-files.txt
